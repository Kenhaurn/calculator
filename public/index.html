<!DOCTYPE html>
<html>

<head>
    <title> Calculator App</title>
</head>

<body>
    <h1 id="display">0</h1>
    <div class="row">
        <button id="modeToggle">DEG</button>
        <button id="clear">cls</button>
        <button id="backSpace">⌫</button>
    </div>
    <div class="row">
        <button id="power">^</button>
        <button id="factorial">!</button>
        <button id="pi">π</button>
        <button id="euler">e</button>
    </div>

    <div class="row">
        <button id="log">log</button>
        <button id="ln">ln</button>
        <button id="sqrt">√</button>
        <button id="openBracket">(</button>
        <button id="closeBracket">)</button>

    </div>
    <div class="row">
        <button id="sin">sin</button>
        <button id="cos">cos</button>
        <button id="tan">tan</button>
    </div>
    <div class="row">
        <button id="one">1</button>
        <button id="two">2</button>
        <button id="three">3</button>
        <button id="add">+</button>
    </div>

    <div class="row">
        <button id="four">4</button>
        <button id="five">5</button>
        <button id="six">6</button>
        <button id="subtract">-</button>
    </div>

    <div class="row">
        <button id="seven">7</button>
        <button id="eight">8</button>
        <button id="nine">9</button>
        <button id="divide">/</button>
    </div>

    <div class="row">
        <button id="zero">0</button>
        <button id="multiply">*</button>
        <button id="decimal">.</button>
        <button id="equalTo">=</button>
    </div>


    <script src="script.js"></script>
</body>

</html>
